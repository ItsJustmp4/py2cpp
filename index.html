<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Py2Cpp2Py | Конвертер Python ↔ C++</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background-color: #111111;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .logo-icon { font-size: 20px; color: #888; }

        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border: 1px solid #444;
            border-radius: 6px;
            background: transparent;
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn:hover { background: #1e1e1e; border-color: #666; color: #fff; }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .btn-primary:hover { background: #e0e0e0; border-color: #e0e0e0; }

        .btn-icon { font-size: 14px; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            gap: 16px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .converter-row {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 420px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #888;
        }

        .panel-lang {
            font-size: 12px;
            color: #666;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .panel-body { flex: 1; position: relative; }

        .panel-body textarea {
            width: 100%;
            height: 100%;
            min-height: 380px;
            background: transparent;
            color: #d4d4d4;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font-family: 'Consolas', 'Courier New', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            tab-size: 4;
        }

        .panel-body textarea::placeholder { color: #555; }

        .converter-middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 8px;
        }

        .arrow-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .arrow-btn:hover { background: #2a2a2a; border-color: #666; color: #fff; }
        .arrow-btn.active { background: #fff; color: #000; border-color: #fff; }

        .direction-label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            writing-mode: vertical-rl;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #111111;
            border-top: 1px solid #2a2a2a;
            font-size: 12px;
            color: #666;
        }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; }
        .status-dot.ready { background: #888; }
        .status-dot.processing { background: #aaa; animation: pulse 1s infinite; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .toast {
            position: fixed; bottom: 60px; right: 24px;
            background: #2a2a2a; color: #ddd;
            padding: 10px 20px; border-radius: 6px;
            font-size: 13px; border: 1px solid #444;
            opacity: 0; transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none; z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        @media (max-width: 900px) {
            .converter-row { flex-direction: column; min-height: auto; }
            .converter-middle { flex-direction: row; padding: 8px 0; }
            .direction-label { writing-mode: horizontal-tb; }
            .panel-body textarea { min-height: 250px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <span class="logo-icon">&lt;/&gt;</span>
        Py2Cpp2Py
    </div>
    <div class="header-actions">
        <button class="btn" onclick="clearAll()">🗑 Очистить</button>
        <button class="btn" onclick="copyResult()">📋 Копировать</button>
        <button class="btn btn-primary" onclick="convert()">⚡ Конвертировать</button>
        <button class="btn" onclick="downloadFile()"> Скачать файл</button>
    </div>
</header>

<main>
    <div class="converter-row">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title" id="pyTitle">Python (input.py)</span>
                <span class="panel-lang">Python 3</span>
            </div>
            <div class="panel-body">
                <textarea id="pythonInput" placeholder="# Введите код Python здесь...&#10;def hello():&#10;    print('Hello, World!')&#10;&#10;hello()" spellcheck="false"></textarea>
            </div>
        </div>

        <div class="converter-middle">
            <button class="arrow-btn active" id="arrowRight" onclick="setDirection('py2cpp')" title="Python → C++">→</button>
            <span class="direction-label">направление</span>
            <button class="arrow-btn" id="arrowLeft" onclick="setDirection('cpp2py')" title="C++ → Python">←</button>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title" id="cppTitle">C++ (main.cpp)</span>
                <span class="panel-lang">C++ (GCC)</span>
            </div>
            <div class="panel-body">
                <textarea id="cppOutput" placeholder="// Результат конвертации появится здесь..." spellcheck="false" readonly></textarea>
            </div>
        </div>
    </div>
</main>

<div class="status-bar">
    <div class="status-dot ready" id="statusDot"></div>
    <span id="statusText">Готов к работе</span>
</div>

<div class="toast" id="toast"></div>

<script>
let currentDirection = 'py2cpp';

function setDirection(dir) {
    currentDirection = dir;
    const arrowRight = document.getElementById('arrowRight');
    const arrowLeft = document.getElementById('arrowLeft');
    const pyTitle = document.getElementById('pyTitle');
    const cppTitle = document.getElementById('cppTitle');
    const pyInput = document.getElementById('pythonInput');
    const cppOutput = document.getElementById('cppOutput');

    if (dir === 'py2cpp') {
        arrowRight.classList.add('active');
        arrowLeft.classList.remove('active');
        pyTitle.textContent = 'Python (input.py)';
        cppTitle.textContent = 'C++ (main.cpp)';
        pyInput.readOnly = false;
        cppOutput.readOnly = true;
    } else {
        arrowLeft.classList.add('active');
        arrowRight.classList.remove('active');
        pyTitle.textContent = 'Python (output.py)';
        cppTitle.textContent = 'C++ (input.cpp)';
        pyInput.readOnly = true;
        cppOutput.readOnly = false;
    }
}

function convert() {
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    statusDot.className = 'status-dot processing';
    statusText.textContent = 'Конвертация...';

    setTimeout(() => {
        try {
            if (currentDirection === 'py2cpp') {
                const pyCode = document.getElementById('pythonInput').value.trim();
                if (!pyCode) {
                    showToast('Введите код Python для конвертации');
                    statusDot.className = 'status-dot ready';
                    statusText.textContent = 'Ошибка';
                    return;
                }
                const cppCode = pyToCpp(pyCode);
                document.getElementById('cppOutput').value = cppCode;
                showToast('Конвертация Python → C++ завершена');
            } else {
                const cppCode = document.getElementById('cppOutput').value.trim();
                if (!cppCode) {
                    showToast('Введите код C++ для конвертации');
                    statusDot.className = 'status-dot ready';
                    statusText.textContent = 'Ошибка';
                    return;
                }
                const pyCode = cppToPy(cppCode);
                document.getElementById('pythonInput').value = pyCode;
                showToast('Конвертация C++ → Python завершена');
            }
        } catch (e) {
            showToast('Ошибка конвертации: ' + e.message);
        }

        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Готов к работе';
    }, 300);
}

function pyToCpp(code) {
    let cpp = '#include <iostream>\n#include <string>\n#include <vector>\n#include <cmath>\nusing namespace std;\n\n';

    const lines = code.split('\n');
    let inMain = false;
    let braceDepth = 0;

    for (let line of lines) {
        const trimmed = line.trim();

        if (trimmed === '') {
            cpp += '\n';
            continue;
        }

        if (trimmed.startsWith('#')) {
            cpp += '    // ' + trimmed.substring(1).trim() + '\n';
            continue;
        }

        const defMatch = trimmed.match(/^def\s+(\w+)\s*\(([^)]*)\)\s*:/);
        if (defMatch) {
            const funcName = defMatch[1];
            const params = defMatch[2] ? defMatch[2].split(',').map(p => {
                const pname = p.trim().split(':')[0].split('=')[0].trim();
                return 'int ' + pname;
            }).join(', ') : '';
            if (funcName === 'main') {
                cpp += 'int main(' + params + ') {\n';
                inMain = true;
            } else {
                cpp += 'void ' + funcName + '(' + params + ') {\n';
            }
            braceDepth++;
            continue;
        }

        const printMatch = trimmed.match(/^print\s*\((.+)\)\s*$/);
        if (printMatch) {
            let arg = printMatch[1];
            if (arg.startsWith("f'") || arg.startsWith('f"')) {
                const quote = arg[1];
                const inner = arg.slice(2, -1);
                const parts = inner.split(/\{(\w+)\}/);
                let expr = '';
                for (let i = 0; i < parts.length; i++) {
                    if (i % 2 === 0) {
                        expr += '"' + parts[i] + '"';
                    } else {
                        expr += ' << ' + parts[i] + ' << ';
                    }
                }
                expr = expr.replace(/" << "/g, '');
                cpp += '    cout << ' + expr + ' << endl;\n';
            } else if (arg.startsWith("'") || arg.startsWith('"')) {
                cpp += '    cout << ' + arg + ' << endl;\n';
            } else {
                cpp += '    cout << ' + arg + ' << endl;\n';
            }
            continue;
        }

        const intInputMatch = trimmed.match(/^(\w+)\s*=\s*int\s*\(\s*input\s*\(\s*(?:["'](.+?)["']\s*)?\)\)\s*$/);
        if (intInputMatch) {
            const varName = intInputMatch[1];
            const prompt = intInputMatch[2] || '';
            if (prompt) cpp += '    cout << "' + prompt + '";\n';
            cpp += '    int ' + varName + ';\n    cin >> ' + varName + ';\n';
            continue;
        }

        const floatInputMatch = trimmed.match(/^(\w+)\s*=\s*float\s*\(\s*input\s*\(\s*(?:["'](.+?)["']\s*)?\)\)\s*$/);
        if (floatInputMatch) {
            const varName = floatInputMatch[1];
            const prompt = floatInputMatch[2] || '';
            if (prompt) cpp += '    cout << "' + prompt + '";\n';
            cpp += '    double ' + varName + ';\n    cin >> ' + varName + ';\n';
            continue;
        }

        const inputMatch = trimmed.match(/^(\w+)\s*=\s*input\s*\(\s*(?:["'](.+?)["']\s*)?\)\s*$/);
        if (inputMatch) {
            const varName = inputMatch[1];
            const prompt = inputMatch[2] || '';
            if (prompt) cpp += '    cout << "' + prompt + '";\n';
            cpp += '    string ' + varName + ';\n    getline(cin, ' + varName + ');\n';
            continue;
        }

        const forMatch = trimmed.match(/^for\s+(\w+)\s+in\s+range\s*\((.+)\)\s*:/);
        if (forMatch) {
            const varName = forMatch[1];
            const rangeArg = forMatch[2];
            const parts = rangeArg.split(',').map(s => s.trim());
            let start, end, step;
            if (parts.length === 1) { start = 0; end = parts[0]; step = 1; }
            else if (parts.length === 2) { start = parts[0]; end = parts[1]; step = 1; }
            else { start = parts[0]; end = parts[1]; step = parts[2]; }
            cpp += '    for (int ' + varName + ' = ' + start + '; ' + varName + ' < ' + end + '; ' + varName + ' += ' + step + ') {\n';
            braceDepth++;
            continue;
        }

        const ifMatch = trimmed.match(/^if\s+(.+)\s*:/);
        if (ifMatch) {
            let cond = ifMatch[1]
                .replace(/ and /g, ' && ')
                .replace(/ or /g, ' || ')
                .replace(/ not /g, '!')
                .replace(/==/g, '==')
                .replace(/!=/g, '!=');
            cpp += '    if (' + cond + ') {\n';
            braceDepth++;
            continue;
        }

        const elifMatch = trimmed.match(/^elif\s+(.+)\s*:/);
        if (elifMatch) {
            let cond = elifMatch[1]
                .replace(/ and /g, ' && ')
                .replace(/ or /g, ' || ')
                .replace(/ not /g, '!');
            cpp += '    } else if (' + cond + ') {\n';
            continue;
        }

        if (trimmed === 'else:') {
            cpp += '    } else {\n';
            braceDepth++;
            continue;
        }

        const whileMatch = trimmed.match(/^while\s+(.+)\s*:/);
        if (whileMatch) {
            let cond = whileMatch[1]
                .replace(/ and /g, ' && ')
                .replace(/ or /g, ' || ')
                .replace(/ not /g, '!');
            cpp += '    while (' + cond + ') {\n';
            braceDepth++;
            continue;
        }

        const returnMatch = trimmed.match(/^return\s+(.+)\s*$/);
        if (returnMatch) {
            cpp += '    return ' + returnMatch[1] + ';\n';
            continue;
        }
        if (trimmed === 'return') {
            cpp += '    return;\n';
            continue;
        }

        const assignMatch = trimmed.match(/^(\w+)\s*=\s*(.+)\s*$/);
        if (assignMatch) {
            const varName = assignMatch[1];
            const value = assignMatch[2];
            if (/^\d+$/.test(value)) {
                cpp += '    int ' + varName + ' = ' + value + ';\n';
            } else if (/^\d+\.\d+$/.test(value)) {
                cpp += '    double ' + varName + ' = ' + value + ';\n';
            } else if (/^["']/.test(value)) {
                cpp += '    string ' + varName + ' = ' + value + ';\n';
            } else if (/^\[/.test(value)) {
                const arr = value.replace(/\[/g, '{').replace(/\]/g, '}');
                cpp += '    vector<int> ' + varName + ' = ' + arr + ';\n';
            } else if (/^(True|False)$/.test(value)) {
                cpp += '    bool ' + varName + ' = ' + (value === 'True' ? 'true' : 'false') + ';\n';
            } else if (/^(None)$/.test(value)) {
                cpp += '    // ' + varName + ' = None\n';
            } else {
                cpp += '    auto ' + varName + ' = ' + value + ';\n';
            }
            continue;
        }

        const funcCallMatch = trimmed.match(/^(\w+)\s*\(([^)]*)\)\s*$/);
        if (funcCallMatch) {
            cpp += '    ' + funcCallMatch[1] + '(' + funcCallMatch[2] + ');\n';
            continue;
        }

        const lenMatch = trimmed.match(/^(\w+)\s*=\s*len\s*\((\w+)\)\s*$/);
        if (lenMatch) {
            cpp += '    int ' + lenMatch[1] + ' = ' + lenMatch[2] + '.size();\n';
            continue;
        }

        const appendMatch = trimmed.match(/^(\w+)\.append\s*\((.+)\)\s*$/);
        if (appendMatch) {
            cpp += '    ' + appendMatch[1] + '.push_back(' + appendMatch[2] + ');\n';
            continue;
        }

        cpp += '    ' + trimmed + '\n';
    }

    while (braceDepth > 0) {
        cpp += '}\n';
        braceDepth--;
    }

    if (!inMain && !code.includes('def main')) {
        const body = cpp.split('\n').slice(5).join('\n');
        cpp = '#include <iostream>\n#include <string>\n#include <vector>\n#include <cmath>\nusing namespace std;\n\nint main() {\n' + body + '\n    return 0;\n}\n';
    } else if (!cpp.includes('return 0')) {
        cpp = cpp.replace(/}\s*$/, '    return 0;\n}\n');
    }

    return cpp;
}

function cppToPy(code) {
    let py = '';
    const lines = code.split('\n');

    for (let line of lines) {
        const trimmed = line.trim();

        if (trimmed.startsWith('#include') || trimmed.startsWith('using namespace')) continue;
        if (trimmed.match(/int\s+main\s*\(/)) continue;

        const funcMatch = trimmed.match(/(?:void|int|double|string|bool|auto)\s+(\w+)\s*\(([^)]*)\)\s*\{?/);
        if (funcMatch && !trimmed.startsWith('for') && !trimmed.startsWith('if') && !trimmed.startsWith('while')) {
            const funcName = funcMatch[1];
            const params = funcMatch[2] ? funcMatch[2].split(',').map(p => p.trim().split(/\s+/).pop()).join(', ') : '';
            py += 'def ' + funcName + '(' + params + '):\n';
            continue;
        }

        const coutMatch = trimmed.match(/cout\s*<<\s*(.+?)\s*<<\s*endl\s*;/);
        if (coutMatch) {
            let arg = coutMatch[1];
            arg = arg.replace(/\s*<<\s*/g, '');
            arg = arg.replace(/^["']|["']$/g, '');
            py += '    print("' + arg + '")\n';
            continue;
        }

        const coutVarMatch = trimmed.match(/cout\s*<<\s*(\w+)\s*<<\s*endl\s*;/);
        if (coutVarMatch) {
            py += '    print(' + coutVarMatch[1] + ')\n';
            continue;
        }

        const cinMatch = trimmed.match(/cin\s*>>\s*(\w+)\s*;/);
        if (cinMatch) {
            py += '    ' + cinMatch[1] + ' = input()\n';
            continue;
        }

        if (trimmed === 'return 0;') continue;

        const varMatch = trimmed.match(/(?:int|double|string|bool|auto|long|float|char)\s+(\w+)\s*=\s*(.+?);/);
        if (varMatch) {
            py += '    ' + varMatch[1] + ' = ' + varMatch[2] + '\n';
            continue;
        }

        const varDeclMatch = trimmed.match(/(?:int|double|string|bool|auto|long|float|char)\s+(\w+)\s*;/);
        if (varDeclMatch) {
            py += '    ' + varDeclMatch[1] + ' = 0\n';
            continue;
        }

        const forMatch = trimmed.match(/for\s*\(\s*(?:int\s+)?(\w+)\s*=\s*(\d+)\s*;\s*\w+\s*<\s*(\w+)\s*;\s*\w+\+\+\s*\)\s*\{?/);
        if (forMatch) {
            py += '    for ' + forMatch[1] + ' in range(' + forMatch[2] + ', ' + forMatch[3] + '):\n';
            continue;
        }

        const ifMatch = trimmed.match(/if\s*\((.+)\)\s*\{?/);
        if (ifMatch) {
            let cond = ifMatch[1]
                .replace(/&&/g, ' and ')
                .replace(/\|\|/g, ' or ')
                .replace(/!/g, ' not ');
            py += '    if ' + cond + ':\n';
            continue;
        }

        const elifMatch = trimmed.match(/\}\s*else\s+if\s*\((.+)\)\s*\{?/);
        if (elifMatch) {
            let cond = elifMatch[1]
                .replace(/&&/g, ' and ')
                .replace(/\|\|/g, ' or ');
            py += '    elif ' + cond + ':\n';
            continue;
        }

        if (trimmed.match(/\}\s*else\s*\{?/)) {
            py += '    else:\n';
            continue;
        }

        const whileMatch = trimmed.match(/while\s*\((.+)\)\s*\{?/);
        if (whileMatch) {
            let cond = whileMatch[1]
                .replace(/&&/g, ' and ')
                .replace(/\|\|/g, ' or ')
                .replace(/!/g, ' not ');
            py += '    while ' + cond + ':\n';
            continue;
        }

        const returnMatch = trimmed.match(/return\s+(.+);/);
        if (returnMatch) {
            py += '    return ' + returnMatch[1] + '\n';
            continue;
        }

        const pushMatch = trimmed.match(/(\w+)\.push_back\s*\((.+)\)\s*;/);
        if (pushMatch) {
            py += '    ' + pushMatch[1] + '.append(' + pushMatch[2] + ')\n';
            continue;
        }

        const sizeMatch = trimmed.match(/(\w+)\s*=\s*(\w+)\.size\s*\(\)\s*;/);
        if (sizeMatch) {
            py += '    ' + sizeMatch[1] + ' = len(' + sizeMatch[2] + ')\n';
            continue;
        }

        if (trimmed === '}') continue;

        if (trimmed.startsWith('//')) {
            py += '    # ' + trimmed.substring(2).trim() + '\n';
            continue;
        }

        const callMatch = trimmed.match(/(\w+)\s*\(([^)]*)\)\s*;/);
        if (callMatch) {
            py += '    ' + callMatch[1] + '(' + callMatch[2] + ')\n';
            continue;
        }

        if (trimmed) {
            py += '    ' + trimmed.replace(/;$/, '') + '\n';
        }
    }

    return py || '# Конвертированный код из C++\n';
}

function clearAll() {
    document.getElementById('pythonInput').value = '';
    document.getElementById('cppOutput').value = '';
    showToast('Очищено');
}

function copyResult() {
    let text = '';
    if (currentDirection === 'py2cpp') {
        text = document.getElementById('cppOutput').value;
    } else {
        text = document.getElementById('pythonInput').value;
    }
    if (!text) { showToast('Нечего копировать'); return; }
    navigator.clipboard.writeText(text).then(() => {
        showToast('Скопировано в буфер обмена');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Скопировано в буфер обмена');
    });
}

function downloadFile() {
    let content, filename;
    if (currentDirection === 'py2cpp') {
        content = document.getElementById('cppOutput').value;
        filename = 'main.cpp';
    } else {
        content = document.getElementById('pythonInput').value;
        filename = 'output.py';
    }
    if (!content) { showToast('Нечего скачивать'); return; }
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Файл ' + filename + ' скачан');
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

document.querySelectorAll('textarea').forEach(ta => {
    ta.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 4;
        }
    });
});
</script>
