<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Py2Cpp / Cpp2Py</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #282a36;
            --text: #cdd6f4;
            --accent: #89b4fa;
            --accent-hover: #74c7ec;
            --border: #45475a;
            --success: #a6e3a1;
            --warning: #f9e2af;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 2.5rem; color: var(--accent); }
        .badges { margin-top: 10px; font-size: 0.9rem; color: var(--warning); font-weight: bold; letter-spacing: 1px; }

        .direction-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .dir-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            color: var(--text);
            transition: all 0.2s;
        }
        .dir-btn.active {
            background: var(--accent);
            color: #1e1e2e;
        }
        .dir-btn:hover:not(.active) {
            background: var(--border);
        }

        .container {
            width: 100%; max-width: 1200px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;
        }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .panel {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .panel-title { font-weight: bold; color: var(--accent); }
        textarea {
            width: 100%; height: 400px; background: #181825; color: var(--text);
            border: 1px solid var(--border); border-radius: 4px; padding: 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px; resize: vertical; box-sizing: border-box;
        }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: #1e1e2e; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #585b70; }
        .examples { margin-bottom: 20px; text-align: center; }
        .examples button {
            margin: 0 5px; padding: 5px 15px; font-size: 0.9rem;
            background: transparent; border: 1px solid var(--border); color: var(--text);
        }
        .examples button:hover { border-color: var(--accent); color: var(--accent); }
        .warning {
            max-width: 1200px; background: rgba(249,226,175,0.1);
            border-left: 4px solid var(--warning); padding: 15px;
            border-radius: 4px; font-size: 0.9rem; color: var(--warning); margin-top: 20px;
        }
        footer { margin-top: 30px; font-size: 0.8rem; color: #6c7086; }
    </style>
</head>
<body>

<header>
    <h1>Py ⇄ Cpp</h1>
    <p>Двунаправленный конвертер Python ↔ C++</p>
</header>

<div class="direction-switcher">
    <button class="dir-btn active" id="btn-py2cpp" onclick="setDirection('py2cpp')">Python → C++</button>
    <button class="dir-btn" id="btn-cpp2py" onclick="setDirection('cpp2py')">C++ → Python</button>
</div>

<div class="examples" id="examples-container"></div>

<div class="container">
    <div class="panel">
        <div class="panel-header">
            <span class="panel-title" id="left-title">Python (input.py)</span>
            <button class="btn-secondary" onclick="clearCode()">Очистить</button>
        </div>
        <textarea id="leftCode" placeholder="Вставьте код сюда..."></textarea>
    </div>
    <div class="panel">
        <div class="panel-header">
            <span class="panel-title" id="right-title">C++ (main.cpp)</span>
            <button class="btn-secondary" onclick="copyCode()">Копировать</button>
        </div>
        <textarea id="rightCode" placeholder="Здесь появится результат..." readonly></textarea>
    </div>
</div>

<div class="controls">
    <button class="btn-primary" onclick="convert()">⚡ Конвертировать</button>
    <button class="btn-secondary" onclick="downloadCode()">Скачать файл</button>
</div>

</div>

<script>
let direction = 'py2cpp';

const examplesPy2Cpp = {
    io: `name = input("Как тебя зовут? ")
print("Привет,", name)`,
    list: `my_list = [10, 20, 30]
my_list.append(40)
print("Длина:", len(my_list))

for item in my_list:
    print(item)`,
    math: `a = 15
b = 25
c = 10
minimum = min(a, b, c)
maximum = max(a, b)
print("Мин:", minimum, "Макс:", maximum)`,
    types: `x = 42
pi = 3.14
greeting = "Hello"
flag = True
result = x + 10
value = min(x, 100)
unknown = some_func(x)
print(x, pi, greeting, flag)`,
    loop: `n = int(input())
if n > 0:
    print("Положительное")
elif n == 0:
    print("Ноль")
else:
    print("Отрицательное")

for i in range(5):
    print(i)`
};

const examplesCpp2Py = {
    io: `#include <bits/stdc++.h>
using namespace std;

int main() {
    string name;
    cout << "Как тебя зовут? ";
    cin >> name;
    cout << "Привет, " << name << endl;
    return 0;
}`,
    list: `#include <bits/stdc++.h>
using namespace std;

int main() {
    vector<int> my_list = {10, 20, 30};
    my_list.push_back(40);
    cout << "Длина: " << my_list.size() << endl;
    for (auto item : my_list) {
        cout << item << endl;
    }
    return 0;
}`,
    math: `#include <bits/stdc++.h>
using namespace std;

int main() {
    int a = 15, b = 25, c = 10;
    int minimum = min({a, b, c});
    int maximum = max({a, b});
    cout << "Мин: " << minimum << " Макс: " << maximum << endl;
    return 0;
}`,
    loop: `#include <bits/stdc++.h>
using namespace std;

int main() {
    int n;
    cin >> n;
    if (n > 0) {
        cout << "Положительное" << endl;
    } else if (n == 0) {
        cout << "Ноль" << endl;
    } else {
        cout << "Отрицательное" << endl;
    }
    for (int i = 0; i < 5; i++) {
        cout << i << endl;
    }
    return 0;
}`
};

function setDirection(dir) {
    direction = dir;
    document.getElementById('btn-py2cpp').classList.toggle('active', dir === 'py2cpp');
    document.getElementById('btn-cpp2py').classList.toggle('active', dir === 'cpp2py');
    
    if (dir === 'py2cpp') {
        document.getElementById('left-title').textContent = 'Python (input.py)';
        document.getElementById('right-title').textContent = 'C++ (main.cpp)';
        renderExamples(examplesPy2Cpp);
        document.getElementById('warning-box').innerHTML = '<strong>⚠️ Важно:</strong> это статический конвертер. Тип переменной определяется по правой части. Если тип нельзя определить — используется <code>auto</code>. <code>min</code>/<code>max</code> оборачиваются в фигурные скобки.';
    } else {
        document.getElementById('left-title').textContent = 'C++ (main.cpp)';
        document.getElementById('right-title').textContent = 'Python (output.py)';
        renderExamples(examplesCpp2Py);
        document.getElementById('warning-box').innerHTML = '<strong>⚠️ Важно:</strong> конвертер убирает <code>#include</code>, <code>using namespace</code>, обёртку <code>main()</code>, фигурные скобки заменяет на отступы. Сложные шаблоны и многомерные структуры могут требовать ручной правки.';
    }
    clearCode();
}

function renderExamples(examples) {
    const container = document.getElementById('examples-container');
    const labels = {
        io: 'Ввод / вывод',
        list: 'Списки (vector)',
        math: 'min / max',
        types: 'Типы и auto',
        loop: 'Циклы и условия'
    };
    let html = 'Примеры: ';
    for (const key in examples) {
        if (labels[key]) {
            html += `<button onclick="loadExample('${key}')">${labels[key]}</button>`;
        }
    }
    container.innerHTML = html;
}

function loadExample(key) {
    const examples = direction === 'py2cpp' ? examplesPy2Cpp : examplesCpp2Py;
    document.getElementById('leftCode').value = examples[key];
    convert();
}

function clearCode() {
    document.getElementById('leftCode').value = '';
    document.getElementById('rightCode').value = '';
}

function copyCode() {
    const el = document.getElementById('rightCode');
    el.select();
    document.execCommand('copy');
    alert('Скопировано!');
}

function downloadCode() {
    const text = document.getElementById('rightCode').value;
    if (!text) return;
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = direction === 'py2cpp' ? 'main.cpp' : 'output.py';
    a.click();
}

function convert() {
    const code = document.getElementById('leftCode').value;
    const result = direction === 'py2cpp' ? translateToCpp(code) : translateToPy(code);
    document.getElementById('rightCode').value = result;
}

/* ═══════════════════════════════════════════════════════════
   PYTHON → C++
   ═══════════════════════════════════════════════════════════ */

function inferType(expr) {
    expr = expr.trim().replace(/;$/, '').trim();
    if (/^["'].*["']$/.test(expr))          return 'string';
    if (expr === 'true' || expr === 'false') return 'bool';
    if (/^-?\d+$/.test(expr))               return 'int';
    if (/^-?\d+\.\d+$/.test(expr))          return 'double';
    return 'auto';
}

function translateToCpp(pyCode) {
    const lines = pyCode.split('\n');
    const out = [];
    const stack = [0];

    out.push('#include <bits/stdc++.h>');
    out.push('using namespace std;');
    out.push('');
    out.push('int main() {');

    for (let i = 0; i < lines.length; i++) {
        const raw = lines[i];
        const trimmed = raw.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        const indent = raw.search(/\S/);
        const isElifElse = trimmed.startsWith('elif ') || trimmed.startsWith('else');

        while (stack.length > 1 && indent < stack[stack.length - 1]) {
            const closedIndent = stack.pop();
            if (!isElifElse) {
                out.push(' '.repeat(closedIndent) + '}');
            }
        }

        const cpp = translateLineToCpp(trimmed);
        
        const opensBlock = trimmed.endsWith(':') &&
            /^(if |elif |else|while |for |def )/.test(trimmed);
        if (opensBlock) {
            stack.push(indent + 4);
        }

        const sub = cpp.split('\n');
        for (const s of sub) {
            out.push(' '.repeat(indent) + s);
        }
    }

    while (stack.length > 1) {
        const closedIndent = stack.pop();
        out.push(' '.repeat(closedIndent) + '}');
    }

    out.push('    return 0;');
    out.push('}');
    return out.join('\n');
}

function translateLineToCpp(line) {
    let isBlock = false;
    if (line.endsWith(':') && /^(if |elif |else|while |for |def )/.test(line)) {
        isBlock = true;
        line = line.slice(0, -1);
    }

    line = line.replace(/\bTrue\b/g,  'true');
    line = line.replace(/\bFalse\b/g, 'false');
    line = line.replace(/\band\b/g,   '&&');
    line = line.replace(/\bor\b/g,    '||');
    line = line.replace(/\bnot\b/g,   '!');

    line = line.replace(/\b(min|max)\(([^)]+)\)/g, '$1({$2})');

    let m;
    if ((m = line.match(/^([a-zA-Z_]\w*)\s*=\s*\[(.*)\]$/))) {
        return `vector<int> ${m[1]} = {${m[2]}};`;
    }
    if ((m = line.match(/^([a-zA-Z_]\w*)\s*=\s*\[\]$/))) {
        return `vector<int> ${m[1]};`;
    }
    line = line.replace(/([a-zA-Z_]\w*)\.append\((.*)\)/, '$1.push_back($2);');
    line = line.replace(/len\(([a-zA-Z_]\w*)\)/g, '$1.size()');

    const pm = line.match(/^print\((.*)\)$/);
    if (pm) {
        if (pm[1].trim() === '') return `cout << endl;`;
        let args = pm[1].replace(/,\s*/g, ' << " " << ');
        return `cout << ${args} << endl;`;
    }

    if ((m = line.match(/^([a-zA-Z_]\w*)\s*=\s*int\(input\(\)\)$/)))
        return `int ${m[1]};\ncin >> ${m[1]};`;
    if ((m = line.match(/^([a-zA-Z_]\w*)\s*=\s*float\(input\(\)\)$/)))
        return `double ${m[1]};\ncin >> ${m[1]};`;
    if ((m = line.match(/^([a-zA-Z_]\w*)\s*=\s*input\((.*)\)$/))) {
        const prompt = m[2] ? `cout << ${m[2]};\n` : '';
        return `${prompt}string ${m[1]};\ncin >> ${m[1]};`;
    }

    line = line.replace(/^if\s+(.*)$/,   'if ($1) {');
    line = line.replace(/^elif\s+(.*)$/, '} else if ($1) {');
    line = line.replace(/^else$/,        '} else {');
    line = line.replace(/^while\s+(.*)$/, 'while ($1) {');
    line = line.replace(/^for\s+([a-zA-Z_]\w*)\s+in\s+range\((.*)\)$/,
                         'for (int $1 = 0; $1 < $2; $1++) {');
    line = line.replace(/^for\s+([a-zA-Z_]\w*)\s+in\s+([a-zA-Z_]\w*)$/,
                         'for (auto $1 : $2) {');
    line = line.replace(/^def\s+([a-zA-Z_]\w*)\((.*)\)$/, 'auto $1($2) {');

    line = line.replace(/^return\s+(.*)$/, 'return $1;');
    line = line.replace(/^return$/,        'return;');
    line = line.replace(/\/\//g, '/');

    if (!isBlock &&
        !/^(cout|cin|if|while|for|return|\}|else|auto |int |double |string |bool |vector)/.test(line) &&
        (m = line.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/))) {
        const varName = m[1];
        const expr    = m[2].replace(/;$/, '').trim();
        const type    = inferType(expr);
        return `${type} ${varName} = ${expr};`;
    }

    if (!isBlock && !/[;{}]$/.test(line.trim()) &&
        !/^(cout|cin|if|while|for|return|\}|else)/.test(line)) {
        line += ';';
    }

    return line;
}

/* ═══════════════════════════════════════════════════════════
   C++ → PYTHON
   ═══════════════════════════════════════════════════════════ */

function translateToPy(cppCode) {
    // 1. Убираем служебные строки
    let lines = cppCode.split('\n');
    lines = lines.filter(l => {
        const t = l.trim();
        return t !== '' &&
               !t.startsWith('#include') &&
               !t.startsWith('using namespace') &&
               !/^int\s+main\s*\(\s*\)\s*\{?\s*$/.test(t) &&
               !/^int\s+main\s*\(\s*\)\s*\{$/.test(t);
    });

    const expanded = [];
    let indent = 0;
    for (const raw of lines) {
        const t = raw.trim();
        if (!t) continue;

        if (/^\}\s*(else\s+if\s*\(.*\)\s*\{)?\s*(else\s*\{)?\s*$/.test(t) || t === '}') {
            const m = t.match(/^\}\s*(else\s+if\s*\((.*)\)\s*\{|else\s*\{)\s*$/);
            if (m) {
                indent = Math.max(0, indent - 1);
                if (m[1].startsWith('else if')) {
                    expanded.push({ text: `elif ${m[2]}:`, indent });
                } else {
                    expanded.push({ text: `else:`, indent });
                }
                indent += 1;
            } else {
                indent = Math.max(0, indent - 1);
            }
            continue;
        }

        if (t.endsWith('{')) {
            const head = t.slice(0, -1).trim();
            const converted = convertCppLineToPy(head);
            expanded.push({ text: converted, indent });
            indent += 1;
            continue;
        }

        expanded.push({ text: convertCppLineToPy(t), indent });
    }

    return expanded.map(e => '    '.repeat(e.indent) + e.text).join('\n');
}

function convertCppLineToPy(line) {
    if (!line) return '';

    if (/^return\s+(.+);\s*$/.test(line)) return line.replace(/^return\s+(.+);\s*$/, 'return $1');
    if (line.trim() === 'return;') return 'return';
    if (line.trim() === 'return 0') return '';

    const coutMatch = line.match(/^cout\s*<<\s*(.*?)(?:\s*<<\s*endl)?;\s*$/);
    if (coutMatch) {
        let content = coutMatch[1];
        // Разбираем цепочку << " " <<
        const parts = content.split(/\s*<<\s*/);
        const args = [];
        for (const p of parts) {
            const pt = p.trim();
            if (pt === '" "' || pt === '""') continue;
            args.push(pt);
        }
        if (args.length === 0) return 'print()';
        return `print(${args.join(', ')})`;
    }

    const cinMatch = line.match(/^cin\s*>>\s*([a-zA-Z_]\w*)\s*;\s*$/);
    if (cinMatch) {
        return `${cinMatch[1]} = input()`;
    }

    const declMatch = line.match(/^(int|double|float|string|bool|auto|vector\s*<\s*\w+\s*>)\s+([a-zA-Z_]\w*)\s*=\s*(.+);\s*$/);
    if (declMatch) {
        const type = declMatch[1].trim();
        const name = declMatch[2];
        let val = declMatch[3].trim();
        if (type === 'bool') {
            val = val.replace(/\btrue\b/g, 'True').replace(/\bfalse\b/g, 'False');
        }
        if (type.startsWith('vector')) {
            val = val.replace(/^\{/, '[').replace(/\}$/, ']');
        }
        return `${name} = ${val}`;
    }

    const declNoInit = line.match(/^(int|double|float|string|bool|auto|vector\s*<\s*\w+\s*>)\s+([a-zA-Z_]\w*)\s*;\s*$/);
    if (declNoInit) {
        const type = declNoInit[1].trim();
        const name = declNoInit[2];
        if (type.startsWith('vector')) return `${name} = []`;
        if (type === 'string') return `${name} = ""`;
        if (type === 'bool') return `${name} = False`;
        return `${name} = 0`;
    }

    const multiDecl = line.match(/^(int|double|float|string|bool|auto)\s+(.+);\s*$/);
    if (multiDecl && multiDecl[2].includes(',')) {
        const type = multiDecl[1];
        const parts = multiDecl[2].split(',').map(s => s.trim());
        const results = [];
        for (const p of parts) {
            const m = p.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
            if (m) {
                let val = m[2].trim();
                if (type === 'bool') val = val.replace(/\btrue\b/g, 'True').replace(/\bfalse\b/g, 'False');
                results.push(`${m[1]} = ${val}`);
            }
        }
        return results.join('\n' + '    '.repeat(0));
    }

    line = line.replace(/([a-zA-Z_]\w*)\.push_back\((.*)\)\s*;/, '$1.append($2)');

    line = line.replace(/([a-zA-Z_]\w*)\.size\(\)/g, 'len($1)');

    line = line.replace(/\b(min|max)\(\{([^}]*)\}\)/g, '$1($2)');

    line = line.replace(/&&/g, ' and ');
    line = line.replace(/\|\|/g, ' or ');
    line = line.replace(/!(?!=)/g, 'not ');
    line = line.replace(/\btrue\b/g, 'True');
    line = line.replace(/\bfalse\b/g, 'False');

    line = line.replace(/^if\s*\((.*)\)\s*$/, 'if $1:');
    line = line.replace(/^else\s+if\s*\((.*)\)\s*$/, 'elif $1:');
    line = line.replace(/^else\s*$/, 'else:');
    line = line.replace(/^while\s*\((.*)\)\s*$/, 'while $1:');

    const forRange = line.match(/^for\s*\(\s*int\s+([a-zA-Z_]\w*)\s*=\s*(\d+)\s*;\s*\1\s*<\s*(.+?)\s*;\s*\1\s*\+\+\s*\)\s*$/);
    if (forRange) {
        return `for ${forRange[1]} in range(${forRange[3]}):`;
    }

    const forRangeBased = line.match(/^for\s*\(\s*(?:auto|int|double|float|string)\s+([a-zA-Z_]\w*)\s*:\s*([a-zA-Z_]\w*)\s*\)\s*$/);
    if (forRangeBased) {
        return `for ${forRangeBased[1]} in ${forRangeBased[2]}:`;
    }

    const funcDef = line.match(/^(?:auto|void|int|double|float|string|bool)\s+([a-zA-Z_]\w*)\s*\(([^)]*)\)\s*$/);
    if (funcDef) {
        return `def ${funcDef[1]}(${funcDef[2]}):`;
    }

    line = line.replace(/;\s*$/, '');

    return line;
}

setDirection('py2cpp');
</script>

</body>
</html>
